<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Its LK — Éditeur</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,900&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<header class="nav">
  <a class="logo" href="index.html">Its LK · Éditeur</a>
  <div class="nav-right">
    <a class="btn" href="index.html">Voir le site</a>
  </div>
</header>

<main class="wrap adm">
  <p class="lead">1. Choisis une seule fois le dossier de ton site. 2. Modifie tes dates et tes images ci-dessous. 3. Clique sur « Enregistrer sur le site » : data.js et le dossier img/ sont mis à jour directement, il ne reste qu'à rafraîchir index.html.</p>

  <section class="sec">
    <div class="sec-head mono"><span>Mes dates</span></div>
    <div id="my"></div>
    <button class="btn" id="add-my" type="button">Ajouter une date</button>
  </section>

  <section class="sec">
    <div class="sec-head mono"><span>Soluna Event</span></div>
    <label class="f about"><span class="mono">Texte de présentation</span><textarea id="about" rows="2"></textarea></label>
    <div id="sol"></div>
    <button class="btn" id="add-sol" type="button">Ajouter une soirée</button>
  </section>
</main>

<div class="bar">
  <button class="btn" id="pick" type="button">1. Choisir le dossier du site</button>
  <button class="btn solid" id="dl" type="button">2. Enregistrer sur le site</button>
  <span class="mono" id="st" role="status"></span>
</div>

<script src="data.js"></script>
<script src="admin.js"></script>
</body>
</html>
