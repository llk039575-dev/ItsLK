<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maintenance | DJ LK</title>
<meta name="description" content="Le site de DJ LK est en maintenance. Il sera de retour dans quelques instants.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#07070c">
<!-- Recharge la page toutes les 60 s : dès que le site revient, le visiteur le voit sans rien faire -->
<meta http-equiv="refresh" content="60">
<style>
  :root {
    --bg: #07070c;
    --violet: #7c3aed;
    --magenta: #ec4899;
    --orange: #f97316;
    --ink: #f5f2ff;
    --muted: #b9b2d0;
    --pad: clamp(24px, 6vw, 96px);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { background: var(--bg); }

  body {
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow-x: hidden;
    color: var(--ink);
    background:
      radial-gradient(900px 560px at 4% 6%, rgba(124, 58, 237, .34), transparent 70%),
      radial-gradient(980px 600px at 100% 100%, rgba(236, 72, 153, .30), transparent 70%),
      radial-gradient(560px 380px at 94% 4%, rgba(124, 58, 237, .16), transparent 70%),
      radial-gradient(600px 380px at 0% 100%, rgba(249, 115, 22, .14), transparent 70%),
      var(--bg);
    font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  header {
    padding: clamp(20px, 4vw, 40px) var(--pad) 0;
    position: relative;
    z-index: 2;
  }

  .brand {
    font-size: 1.25rem;
    font-weight: 800;
    letter-spacing: .08em;
    color: var(--ink);
    text-decoration: none;
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 4vh var(--pad) 36vh;
    position: relative;
    z-index: 2;
    max-width: 1100px;
  }

  h1 {
    font-size: clamp(2.8rem, 9vw, 7rem);
    line-height: .95;
    font-weight: 800;
    letter-spacing: -.035em;
    margin-bottom: clamp(16px, 2.5vw, 28px);
  }

  .lead {
    font-size: clamp(1.05rem, 2.2vw, 1.4rem);
    line-height: 1.5;
    color: var(--muted);
    max-width: 34ch;
  }

  .urgent {
    margin-top: clamp(28px, 5vw, 48px);
  }

  .urgent p {
    font-size: 1rem;
    color: var(--muted);
    margin-bottom: 14px;
  }

  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
  }

  .btn {
    display: inline-block;
    padding: 13px 22px;
    border-radius: 999px;
    font-size: 1rem;
    font-weight: 600;
    text-decoration: none;
    color: var(--ink);
    border: 1.5px solid rgba(245, 242, 255, .28);
    background: rgba(7, 7, 12, .45);
    transition: border-color .2s, background .2s;
  }

  .btn:hover { border-color: rgba(245, 242, 255, .7); background: rgba(245, 242, 255, .08); }

  .btn.primary {
    border-color: transparent;
    background: linear-gradient(100deg, var(--violet), var(--magenta));
  }
  .btn.primary:hover { filter: brightness(1.12); }

  .btn:focus-visible, .brand:focus-visible {
    outline: 3px solid var(--orange);
    outline-offset: 3px;
  }

  /* Égaliseur : l'élément visuel principal de la page */
  .eq {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: 32vh;
    display: flex;
    align-items: flex-end;
    gap: clamp(2px, .45vw, 6px);
    padding: 0 clamp(2px, .45vw, 6px);
    pointer-events: none;
    z-index: 1;
    -webkit-mask-image: linear-gradient(to top, #000 35%, transparent);
            mask-image: linear-gradient(to top, #000 35%, transparent);
  }

  .eq span {
    flex: 1;
    height: calc(var(--h) * 100%);
    background: var(--c);
    border-radius: 4px 4px 0 0;
    transform-origin: bottom;
    opacity: .9;
    animation: eq var(--d) ease-in-out var(--delay) infinite alternate;
  }

  @keyframes eq {
    from { transform: scaleY(.3); }
    to   { transform: scaleY(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    .eq span { animation: none; }
  }
</style>
</head>
<body>

<header>
  <a class="brand" href="/" aria-label="DJ LK, accueil">DJ LK</a>
</header>

<main>
  <h1>On règle quel que soucis.</h1>
  <p class="lead">Le site de DJ LK est en maintenance. Il sera de retour dans quelques instants.</p>

  <div class="urgent">
    <p>Besoin de réserver une date en urgence ?</p>
    <div class="actions">
      <a class="btn primary" href="tel:+41774592199">Appeler le +41 77 459 21 99</a>
      <a class="btn" href="https://instagram.com/dj.lk0" rel="noopener">Écrire sur Instagram</a>
    </div>
  </div>
</main>

<div class="eq" id="eq" aria-hidden="true"></div>

<script>
(function () {
  var eq = document.getElementById('eq');
  var N = 64;
  var stops = [[124, 58, 237], [236, 72, 153], [249, 115, 22]]; // violet, magenta, orange

  function mix(a, b, t) { return Math.round(a + (b - a) * t); }
  function color(t) {
    var seg = t < .5 ? 0 : 1;
    var lt = t < .5 ? t * 2 : (t - .5) * 2;
    var a = stops[seg], b = stops[seg + 1];
    return 'rgb(' + mix(a[0], b[0], lt) + ',' + mix(a[1], b[1], lt) + ',' + mix(a[2], b[2], lt) + ')';
  }
  function rnd(i) { return ((i * 9301 + 49297) % 233280) / 233280; }

  for (var i = 0; i < N; i++) {
    var bar = document.createElement('span');
    var h = .3 + .7 * Math.abs(Math.sin(i * .37) * Math.cos(i * .13 + 1)) + rnd(i) * .2;
    bar.style.setProperty('--h', Math.min(h, 1).toFixed(3));
    bar.style.setProperty('--c', color(i / (N - 1)));
    bar.style.setProperty('--d', (0.9 + rnd(i + 7) * 1.2).toFixed(2) + 's');
    bar.style.setProperty('--delay', (-rnd(i + 13) * 2).toFixed(2) + 's');
    eq.appendChild(bar);
  }
})();
</script>
</body>
</html>
